<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Cash It or Chance It: Halloween Edition | MadeToPlayGames
  </title>

  <meta
    name="description"
    content="Cash It or Chance It Halloween Edition - an interactive party game by MadeToPlayGames."
  >

  <link
    rel="icon"
    href="images/favicon.ico"
    type="image/x-icon"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>


<body class="halloween-edition">


  <!-- =====================================================
       INTRO VIDEO
       ===================================================== -->

  <div id="introVideoContainer">

    <video
      id="introVideo"
      playsinline
    >
      <source
        src="videos/intro.mp4"
        type="video/mp4"
      >
    </video>


    <div id="introButtons">

      <button id="introPlayButton">
        Play Intro
      </button>

      <button id="introFullScreenButton">
        Full Screen
      </button>

      <button id="skipIntroButton">
        Skip Intro
      </button>

    </div>

  </div>


  <!-- =====================================================
       LOADING SCREEN
       ===================================================== -->

  <div id="loadingOverlay">
    Loading...
  </div>


  <!-- =====================================================
       TOP HALLOWEEN SCENERY
       ===================================================== -->

  <div
    class="halloween-scenery"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       GAME HEADER
       ===================================================== -->

  <header>

    <div id="headerContent">


      <!-- Decorative corner webs -->

      <div
        class="web-corner web-left"
        aria-hidden="true"
      ></div>

      <div
        class="web-corner web-right"
        aria-hidden="true"
      ></div>


      <!-- Main game title -->

      <div id="headerTitles">

        <h1>

          <span class="cash-title">
            Cash It
          </span>

          <span class="or-title">
            or
          </span>

          <span class="chance-title">
            Chance It
          </span>

        </h1>


        <div class="halloween-subtitle">

          <span aria-hidden="true">
            🎃
          </span>

          Halloween Edition

          <span aria-hidden="true">
            🎃
          </span>

        </div>

      </div>


      <!-- Game controls -->

      <div id="headerButtons">

        <button
          id="fullScreenBtn"
          onclick="toggleFullScreen()"
        >
          Full Screen
        </button>

        <button id="musicToggleBtn">
          🔊 Music On
        </button>

        <button id="watchIntroBtn">
          Watch Intro Again
        </button>

      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN GAME
       ===================================================== -->

  <main>


    <!-- ===================================================
         PHOTO PICKS
         =================================================== -->

    <section id="briefcasesSection">

      <div id="briefcasesContainer"></div>


      <!-- Wooden instruction sign -->

      <div id="briefcasesInfo">

        <span
          class="message-pumpkin"
          aria-hidden="true"
        >
          🎃
        </span>


        <p id="gameMessage">
          Choose a photo to make your pick.
        </p>


        <span
          class="message-pumpkin"
          aria-hidden="true"
        >
          🎃
        </span>

      </div>

    </section>


    <!-- ===================================================
         PRIZE BOARD
         =================================================== -->

    <aside id="prizesSection">

      <h2 class="tricks-title">
        Tricks &amp; Treats
      </h2>


      <ul id="prizeBoard"></ul>


      <div
        class="spooky-divider"
        aria-hidden="true"
      >

        <span>
          🕷️
        </span>

        <span></span>

        <span>
          🕸️
        </span>

      </div>


      <h2 class="offers-title">
        Previous Offers
      </h2>


      <ul id="offersHistory"></ul>

    </aside>

  </main>


  <!-- =====================================================
       BOTTOM HALLOWEEN SCENERY
       ===================================================== -->

  <div
    class="bottom-scene"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       FIREWORKS
       ===================================================== -->

  <div id="fireworksContainer"></div>


  <!-- =====================================================
       AUDIO
       ===================================================== -->

  <audio
    id="backgroundMusic"
    src="audio/halloween-background.mp3"
    preload="auto"
    loop
  ></audio>

  <audio
    id="clickSound"
    src="audio/click.mp3"
    preload="auto"
  ></audio>

  <audio
    id="offerSound"
    src="audio/offer.mp3"
    preload="auto"
  ></audio>

  <audio
    id="declineSound"
    src="audio/decline.mp3"
    preload="auto"
  ></audio>

  <audio
    id="applause"
    src="audio/applause.mp3"
    preload="auto"
  ></audio>

  <audio
    id="suspenseMusic"
    src="audio/jaws.mp3"
    preload="auto"
  ></audio>

  <audio
    id="finalSwapMusic"
    src="audio/finalswap.mp3"
    preload="auto"
  ></audio>


  <!-- =====================================================
       OFFER MODAL
       ===================================================== -->

  <div
    id="offerModal"
    class="modal"
  >

    <div class="modal-content">

      <div id="offerDetails"></div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script defer src="scripts/data.js"></script>
  <script defer src="scripts/render.js"></script>
  <script defer src="scripts/sounds.js"></script>
  <script defer src="scripts/game.js"></script>
  <script defer src="scripts/effects.js"></script>
  <script defer src="scripts/screen.js"></script>
  <script defer src="scripts/intro.js"></script>


  <!-- =====================================================
       INITIALIZE GAME
       ===================================================== -->

  <script>

    window.addEventListener("load", () => {

      const loading =
        document.getElementById("loadingOverlay");

      if (loading) {
        loading.style.display = "none";
      }

      renderBriefcases();

      updateSidePanels();

      showRoundModal(1);

    });

  </script>


</body>

</html>
